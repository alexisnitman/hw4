<style>body{margin:0;padding:2rem;font:16px/1.55 Arial,sans-serif;color:#102c52;background:#dff3ff}main{max-width:1050px;margin:auto}h1{color:#00356b}section{background:#fff;padding:1.25rem;margin:1.25rem 0;border-radius:18px;box-shadow:0 4px 18px #789ab833}img{display:block;max-width:100%;height:auto;border:1px solid #b8c9d8;border-radius:12px}figcaption{margin-top:.75rem}</style></head>
<body><main><h1>Campus Customs live-site checks</h1><p>These screenshots were captured from the running Vite site with the FastAPI backend active.</p>
<section><h2>1. Inventory and price lookup</h2><figure><img src="app_check_images/inventory.png" alt="Chat response showing product price and stock by size"><figcaption>The chat answers a price-and-stock question for the Basic Hoodie Big Yale. The response comes from the database lookup and shows size-level quantities, so the shopper receives factual availability rather than an invented estimate.</figcaption></figure></section>
<section><h2>2. Dynamic hoodie search cards</h2><figure><img src="app_check_images/dynamic_cards.png" alt="Chat response with dynamically loaded hoodie product cards"><figcaption>After the shopper asks “What hoodies do you have?”, the chat response displays matching product cards with images, names, prices, and descriptions. These cards use the same product links as the main catalogue and open the detail view when clicked.</figcaption></figure></section>
<section><h2>3. Problem 9 usability improvement: catalogue filters</h2><figure><img src="app_check_images/usability_filters.png" alt="Products page with product type and price sorting controls"><figcaption>The Products page includes controls for filtering by product type and sorting by price. These controls help shoppers narrow the collection and find an affordable item more quickly.</figcaption></figure></section>
</main></body></html>
